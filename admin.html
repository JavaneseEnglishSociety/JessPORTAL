<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<title>Staff Admin — JESS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--color-bg-tint); }
  .admin-login-page {
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px;
  }
  .admin-login-card {
    width: 100%; max-width: 400px;
    background: var(--color-bg);
    border: var(--rule); border-radius: var(--radius-md);
    box-shadow: var(--edge-md);
    padding: 40px 34px;
    text-align: center;
  }
  .admin-login-card img { height: 56px; margin: 0 auto 18px; }
  .admin-login-card h1 { font-size: 1.9rem; margin-bottom: 4px; }
  .admin-login-card form { display: grid; gap: 7px; margin-top: 24px; text-align: left; }
  .admin-login-card label { font-size: 0.86rem; font-weight: 700; }
  .admin-login-card input {
    padding: 12px 14px;
    border: 1.5px solid var(--color-border-soft);
    border-radius: var(--radius-sm);
    background: var(--color-bg); color: var(--color-text);
    font-size: 0.98rem; outline: none;
  }
  .admin-login-card input:focus { border-color: var(--color-primary); }
  .admin-login-card button[type="submit"] { margin-top: 12px; width: 100%; }
  .login-back { display: inline-block; margin-top: 20px; font-size: 0.88rem; color: var(--color-text-gray); }
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div class="admin-login-page" id="loginGate">
  <div class="admin-login-card">
    <img src="assets/images/logo.png" alt="">
    <h1>Staff admin</h1>
    <p style="color:var(--color-text-gray);font-size:0.93rem;margin:0;">Sign in to edit the JESS site.</p>
    <form id="loginForm">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password" autofocus>
      <p class="form-status err" id="loginStatus" role="alert"></p>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <a href="index.html" class="login-back">&larr; Back to the site</a>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="adminDashboard" hidden>
  <div class="admin-overlay" id="adminOverlay">
    <aside class="admin-sidebar">
      <div class="admin-brand">JESS <span>Staff admin</span></div>
      <nav class="admin-nav" id="adminNav">
        <button data-panel="content" class="active">Content</button>
        <button data-panel="messages">Messages</button>
        <button data-panel="stats">Statistics</button>
        <button data-panel="programs">Programs</button>
        <button data-panel="events">Events</button>
        <button data-panel="team">Team</button>
        <button data-panel="testimonials">Testimonials</button>
        <button data-panel="gallery">Gallery</button>
        <button data-panel="partners">Partners</button>
        <button data-panel="faq">FAQ</button>
        <button data-panel="contact">Contact &amp; footer</button>
        <button data-panel="theme">Theme</button>
        <button data-panel="data">Data</button>
      </nav>
      <a class="btn btn-outline admin-exit" href="index.html" style="text-align:center;text-decoration:none;">View site</a>
      <button class="btn btn-outline admin-exit" id="logoutBtn">Sign out</button>
    </aside>

    <section class="admin-content" id="adminContent">
      <!-- panels injected by admin.js -->
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script type="module" src="data.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
